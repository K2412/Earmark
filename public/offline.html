<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Earmark — offline</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #ededec; display: grid; place-items: center; min-height: 100vh; margin: 0; }
        .card { max-width: 28rem; padding: 2rem; text-align: center; }
        h1 { font-size: 1.25rem; }
        p { color: #a1a09a; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>Earmark needs a connection to your server to show up-to-date financial data. Reconnect and reload — nothing is cached, so you'll never see stale figures.</p>
    </div>
</body>
</html>
